 var t=ex.replace(/,/g,".").match(/\d+(?:\.\d*)?|[-+*\/]/g);if(!t)return null;
 while(t.length&&/[-+*\/]/.test(t[t.length-1]))t.pop();

 $("zkb").onclick=function(){$("set").style.display="none";$("set").innerHTML=""};

 $("set").querySelectorAll(".zkr").forEach(function(e){e.onclick=function(){zkRowSheet(c.rows[+e.dataset.zki])}});
 $("zkpay").onclick=function(){var c2=zkCalc();if(!(c2.zk>0))return;
  pickAcc(function(id){if(!D.cats.exp.some(function(x){return x.n==="Zekat"}))D.cats.exp.push({n:"Zekat",s:[]});
   var t={id:D.seq++,t:"exp",d:ds(new Date()),a:+c2.zk.toFixed(2),c:"Zekat",n:"Zekat "+new Date().getFullYear(),acc:id};D.tx.push(t);
   Z.paid.push({d:t.d,a:t.a,acc:id,tx:t.id});S.la=id;try{localStorage.setItem("pmset",JSON.stringify(S))}catch(e){}save();render();zkRe()},S.la)};
 $("set").querySelectorAll("[data-zku]").forEach(function(b){b.onclick=function(){var p=Z.paid.splice(+b.dataset.zku,1)[0];if(p&&p.tx)D.tx=D.tx.filter(function(x){return x.id!==p.tx});save();render();zkRe()}});
}
function txReset(){
 var n=D.tx.length;
 if(!n){sheet('<div style="font-size:14px;margin-bottom:6px">Silinecek hesap hareketi yok.</div><div class="btns"><button class="p" id="cx">Tamam</button></div>');$("cx").onclick=close;return}
 ask(n+" hesap hareketi (gelir, gider, havale) silinecek. Hesapların, kategorilerin, bütçelerin ve borsa kayıtların kalır. Bakiyeler açılış bakiyesine döner. Bu işlem geri alınamaz.",function(){
  D.tx=[];
  Object.keys(D.inv.ptx||{}).forEach(function(k){delete D.inv.paid[k]});D.inv.ptx={};
  if(D.zk2)D.zk2.paid=[];
  D.acc.forEach(function(a){if(a.qty!==undefined){a.open=0;a.open=a.qty*(a.uv||0)-bal(a)}});
  save();close();$("set").style.display="none";render()})}
function sact(k,l){
 if(k==="txreset")return txReset();
 if(k==="zekat")return openZekat();
 if(k==="types")return openTypes();
 if(k==="lang")return langForm();
 if(k==="dacc")return openDacc();
 if(k==="cur2")return openCur();
 if(k==="bud")return openBud(0);
 if(k==="rec")return openRec();
 if(k==="pin"){if(PIN)pinMenu();else setPin(openSet);return}
 if(k==="cinc")return openCats("inc");
 if(k==="cexp")return openCats("exp");
 if(k==="hes"){$("set").style.display="none";V="hes";render();return}
 if(k==="stil"||k==="reset")return menu(k);
 if(k==="start")S.start=S.start==="tak"?"gun":"tak";
 else if(k==="wk")S.wk=S.wk?0:1;
 else if(k==="carry")S.carry=S.carry?0:1;
 else if(k==="det")S.det=S.det?0:1;
 else if(k==="sub")S.sub=S.sub?0:1;
 else{sheet('<div class="big">'+l+'</div><p style="color:var(--mu)">Bu ayar sonraki adımlarda eklenecek.</p><div class="btns"><button id="cx">Kapat</button></div>');$("cx").onclick=close;return}
 try{localStorage.setItem("pmset",JSON.stringify(S))}catch(e){}
 openSet();render();
}
function menu(m){
 if(m==="yedek")return backup();
 if(m==="ayar")return openSet();
 var t={reset:'<div class="big">Verileri sıfırla</div><p style="color:var(--mu)">Tüm hesapları ve işlemleri silmek geri alınamaz. Önce Yedekle ile bir kopya almanı öneririm.</p><div class="btns"><button id="cx">Kapat</button><button id="rs" class="p">Verileri sıfırla</button></div>',
  stil:'<div class="big" style="margin-bottom:10px">Stil</div><div class="seg" style="padding:0"><button data-th="">Varsayılan</button><button data-th="light">Açık</button><button data-th="dark">Koyu</button></div><div class="btns"><button id="cx">Kapat</button></div>',
  pc:'<div class="big">PC’den Yönet</div><p style="color:var(--mu)">Henüz yok. Şimdilik Yedekle ile verini kopyalayıp başka cihaza taşıyabilirsin.</p><div class="btns"><button id="cx">Kapat</button></div>',
  yardim:'<div class="big">Yardım</div><p style="color:var(--mu)">Sağ alttaki + ile kayıt ekle. Kayda dokununca düzenlersin. Cüzdan sekmesinde bakiyeler görünür.</p><div class="btns"><button id="cx">Kapat</button></div>',
  iletisim:'<div class="big">İletişim</div><p style="color:var(--mu)">İstek ve düzeltmeleri bu sohbette bana yazabilirsin.</p><div class="btns"><button id="cx">Kapat</button></div>'};
 sheet(t[m]);$("cx").onclick=close;
}
try{var th0=localStorage.getItem("pmth");if(th0)document.documentElement.setAttribute("data-theme",th0)}catch(e){}
if(S.lang==="en")startLang();render();lockApp();
